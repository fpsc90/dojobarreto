  color-scheme:dark;
  --bg:#0a0a0a; --bg2:#121212; --line:#262626;
  --fg:#f5f5f5; --muted:#9a9a9a; --accent:#c9a585; /* ouro rosé, tirado da logo */
  --g1:#3e2f25; --g2:#8f6f55; --g3:#c9a585; --g4:#f4e7d6; /* tons do metal da logo */
  --head:'Oswald',sans-serif; --body:'Inter',sans-serif;
}
*{box-sizing:border-box}
body,h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video,iframe{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.12em;font-weight:500;line-height:1.15}
.wrap{max-width:1264px;margin-inline:auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
section{padding:120px 0;border-top:1px solid var(--line)}
.kicker{font-family:var(--head);color:var(--accent);letter-spacing:.35em;font-size:.8rem;text-transform:uppercase;margin-bottom:18px}
h2{font-size:clamp(2rem,5vw,3.6rem);margin-bottom:28px}
.lead{color:var(--muted);max-width:640px;font-size:1.05rem;text-wrap:pretty}
.btn{display:inline-block;border:1px solid var(--fg);padding:16px 40px;font-family:var(--head);text-transform:uppercase;letter-spacing:.25em;font-size:.85rem;transition:.3s}
.btn:hover{background:var(--fg);color:#000}
.btn.solid{background:linear-gradient(105deg,var(--g2),var(--g4) 35%,var(--g3) 55%,var(--g2) 80%,var(--g3));background-size:220% 100%;color:#1b130d;border-color:var(--g3);font-weight:500}
.btn.solid:hover{background-position:100% 0;color:#1b130d}

/* Placeholder de imagem */
.ph{background:repeating-linear-gradient(135deg,#151515 0 12px,#1a1a1a 12px 24px);display:grid;place-items:center;color:#555;font-family:var(--head);letter-spacing:.25em;font-size:.75rem;text-transform:uppercase;text-align:center;padding:12px}
.media{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:transform .8s,filter .8s}

/* NAV */
nav{position:fixed;inset:0 0 auto;z-index:50;transition:.4s;padding-top:env(safe-area-inset-top,0px)}
nav.scrolled{background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:80px}
.logo{font-family:var(--head);font-size:1.3rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:12px}
.logo img{height:44px}
.menu{display:flex;gap:34px;list-style:none}
.menu a{font-family:var(--head);text-transform:uppercase;letter-spacing:.2em;font-size:.8rem;color:#ccc;transition:.2s}
.menu a:hover{color:var(--accent)}
.burger{display:none;background:none;border:0;color:var(--fg);font-size:1.6rem;cursor:pointer}

/* HERO */
.hero{position:relative;height:88svh;min-height:560px;max-height:960px;display:grid;place-items:center;text-align:center;overflow:hidden;border:0;padding:0}
.hero .bg{position:absolute;inset:0}
.hero .bg .media{transform:scale(1.05)}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.7) 70%,var(--bg))}
.hero .in{position:relative;padding:0 16px}
.hero h1{font-size:clamp(2.8rem,10vw,7.5rem);letter-spacing:.18em;font-weight:700}
.hero h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== LOGO DOURADA — nascer do sol atrás do telhado ===== */
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#dust{position:absolute;inset:0;width:100%;height:100%}
.crest{position:relative;width:min(600px,82vw);aspect-ratio:930/589;margin:0 auto}
.crest .sun,.crest .rays{position:absolute;left:50%;top:1.4%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%}
.crest .sun{width:min(1150px,170vw);background:radial-gradient(circle,rgba(244,226,200,.30) 0%,rgba(201,165,133,.16) 14%,rgba(201,165,133,.06) 34%,transparent 60%);animation:sunrise 3.2s cubic-bezier(.2,.7,.2,1) both,breathe 9s 3.2s ease-in-out infinite}
.crest .rays{width:min(1700px,240vw);background:repeating-conic-gradient(from 0deg,rgba(244,226,200,.075) 0deg 2.2deg,transparent 2.2deg 11deg);-webkit-mask:radial-gradient(circle,#000 4%,transparent 52%);mask:radial-gradient(circle,#000 4%,transparent 52%);animation:raysIn 3s 1s both,spin 160s linear infinite}
.crest .layer{position:absolute;inset:0;z-index:1;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(105deg,var(--g1) 0%,var(--g2) 16%,var(--g4) 27%,var(--g3) 35%,#6b5242 47%,var(--g3) 59%,var(--g4) 69%,var(--g3) 77%,var(--g1) 100%);
  background-size:230% 100%;filter:drop-shadow(0 0 0 transparent)}
.crest .layer::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 44%,rgba(255,251,244,.95) 50%,transparent 56%);background-size:300% 100%;background-position:100% 0;animation:glint 7s 2.8s ease-in-out infinite}
.crest .layer::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--lx,50%) var(--ly,0%),rgba(255,248,236,.9),rgba(255,226,190,.35) 9%,transparent 24%);mix-blend-mode:screen}
.crest .roof{--m:var(--m-roof);animation:metal 10s ease-in-out infinite alternate,roofIn 1.9s .2s cubic-bezier(.75,0,.2,1) both}
.crest .text{--m:var(--m-text);animation:metal 10s ease-in-out infinite alternate,textIn 1.5s 1.2s ease-out both}
.crest .line{--m:var(--m-line);animation:metal 10s ease-in-out infinite alternate,lineIn 1s 2s cubic-bezier(.6,0,.2,1) both}
.crest .flare{position:absolute;left:50%;top:1.4%;z-index:2;width:90px;height:90px;transform:translate(-50%,-50%) scale(0);pointer-events:none;opacity:0;animation:flare 7s 2.8s ease-in-out infinite;
  background:radial-gradient(circle,#fff 0 1.5px,rgba(255,240,215,.75) 3px,rgba(255,220,180,.18) 14px,transparent 34px),linear-gradient(90deg,transparent 0,rgba(255,244,228,.9) 50%,transparent 100%) center/100% 1.5px no-repeat,linear-gradient(0deg,transparent 0,rgba(255,244,228,.9) 50%,transparent 100%) center/1.5px 100% no-repeat}
.hero .in > p,.hero .ctas{animation:fadeUp 1.4s 2.2s ease-out both}
@keyframes metal{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes glint{0%{background-position:100% 0}38%,100%{background-position:0% 0}}
@keyframes flare{0%,12%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0)}19%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(45deg)}28%,100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(90deg)}}
@keyframes roofIn{from{clip-path:inset(0 50% 0 50%);transform:translateY(14px)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes textIn{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes lineIn{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
@keyframes sunrise{from{opacity:0;transform:translate(-50%,-30%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Logo pequena no menu */
.logo .mini{width:52px;aspect-ratio:930/317;-webkit-mask:var(--m-roof) top/100% auto no-repeat;mask:var(--m-roof) top/100% auto no-repeat;background:linear-gradient(105deg,var(--g2),var(--g4) 40%,var(--g3) 60%,var(--g2));background-size:220% 100%;animation:metal 6s ease-in-out infinite alternate}
.logo .word{background:linear-gradient(105deg,var(--g3),var(--g4) 45%,var(--g3) 60%,var(--g2));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:metal 6s ease-in-out infinite alternate;font-weight:400}
.hero p{color:#cfcfcf;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(.7rem,1.6vw,.95rem);margin:18px 0 44px}
.hero .ctas{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hero .ctas .btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:250px}
.scroll{position:absolute;bottom:34px;left:50%;width:1px;height:60px;background:linear-gradient(var(--fg),transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* SOBRE */
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.split .pic{aspect-ratio:4/5;overflow:hidden}
.split .txt p+p{margin-top:18px}
.quote{margin-top:36px;padding-left:22px;border-left:2px solid var(--accent);font-family:var(--head);text-transform:uppercase;letter-spacing:.12em;font-size:1.1rem;color:#ddd}

/* PROGRAMAS */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:60px}
.turmas{grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:800px){.turmas{grid-template-columns:1fr}}
.card{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--bg2)}
.card .pic{position:absolute;inset:0}
.card .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.92))}
.card .txt{position:absolute;inset:auto 0 0;padding:32px}
.card h3{font-size:1.6rem;margin-bottom:8px}
.card p{color:#bbb;font-size:.95rem}
.card .tag{font-family:var(--head);color:var(--accent);letter-spacing:.25em;font-size:.72rem;text-transform:uppercase}
.card .cor{background:#0d0b0a}
.card .cor .media,.card:hover .cor .media{filter:none;object-fit:contain;object-position:center 4%}
.card:hover .media{transform:scale(1.06);filter:grayscale(.3)}

/* PROFESSORES */
.profs{display:grid;gap:110px;margin-top:70px}
.prof{display:grid;grid-template-columns:5fr 7fr;gap:72px;align-items:start}
.prof:nth-child(even){grid-template-columns:7fr 5fr}
.prof:nth-child(even) .pic{order:2}
.prof .pic{aspect-ratio:3/4;max-width:100%;overflow:hidden;position:sticky;top:110px}
.prof .bio{min-width:0;max-width:680px}
.prof h3{font-size:clamp(1.6rem,3vw,2.3rem)}
.prof .faixa{color:var(--accent);font-family:var(--head);letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;margin:8px 0 26px}
.prof p{color:var(--muted);font-size:.98rem;text-wrap:pretty;hyphens:manual}
.nw{white-space:nowrap}
.prof p+p{margin-top:14px}
.feitos{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.feitos li{border:1px solid rgba(201,165,133,.45);color:var(--g4);font-family:var(--head);letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;padding:7px 12px}
.spot{margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}
.spot h3{font-size:1.15rem;color:var(--accent);letter-spacing:.18em;margin-bottom:14px}
.spot p{color:var(--muted);font-size:.95rem}
.spot p+p{margin-top:12px}
#sobre .split{align-items:start}
#sobre .split .pic{position:sticky;top:110px;aspect-ratio:1448/1086}
#sobre .split .pic .media{filter:none}
button.zoom{cursor:zoom-in;position:relative;display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit}
.zoom .zoom-ico{position:absolute;right:14px;bottom:14px;width:40px;height:40px;display:grid;place-items:center;background:rgba(10,10,10,.65);border:1px solid rgba(201,165,133,.5);color:var(--g4);font-size:1.1rem;opacity:.8;transition:.3s}
.zoom:hover .zoom-ico,.zoom:focus-visible .zoom-ico{opacity:1;border-color:var(--accent)}
.zoom:hover .media{transform:scale(1.02)}
/* Visualização ampliada */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,5,5,.94);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out;animation:lbIn .35s ease}
.lb[hidden]{display:none}
.lb img{width:auto;height:auto;max-width:min(100%,1600px);max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:48px;height:48px;background:none;border:1px solid var(--line);color:var(--fg);font-size:1.6rem;cursor:pointer}
.lb button:hover{border-color:var(--accent);color:var(--accent)}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#sobre .split{align-items:center}
@media (max-width:900px){.prof,.prof:nth-child(even){grid-template-columns:1fr;gap:32px}.prof:nth-child(even) .pic{order:0}.prof .pic,#sobre .split .pic{position:static;max-width:440px}.profs{gap:80px}}
.prof:hover .media{transform:scale(1.04);filter:grayscale(0)}
.prof .pic.on .media{filter:grayscale(0)}

/* GALERIA DE COMPETIÇÃO (carrossel) */
.car-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.car-head h2{margin-bottom:18px}
.car-nav{display:flex;align-items:center;gap:12px}
.car-count{font-family:var(--head);letter-spacing:.2em;color:var(--muted);font-size:.85rem;margin-right:10px;font-variant-numeric:tabular-nums}
.car-count b{color:var(--accent);font-weight:500}
.car-btn{width:52px;height:52px;border:1px solid var(--line);background:none;color:var(--fg);font-size:1.2rem;cursor:pointer;transition:.25s}
.car-btn:hover{border-color:var(--accent);color:var(--accent)}
.car-btn:disabled{opacity:.3;cursor:default;border-color:var(--line);color:var(--fg)}
.carousel{margin-top:40px}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;outline:none;padding-block:10px}
.track::-webkit-scrollbar{display:none}
/* todas ficam um pouco menores; a foto em destaque (centralizada) volta ao tamanho cheio */
.slide{flex:0 0 auto;height:clamp(320px,44vw,580px);max-width:86vw;margin:0;overflow:hidden;scroll-snap-align:center;background:var(--bg2);transform:scale(.86);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.slide:first-child{scroll-snap-align:start;transform-origin:left center}
.slide:last-child{scroll-snap-align:end;transform-origin:right center}
.slide.on{transform:none}
.slide img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);opacity:.5;transition:filter .7s,opacity .6s}
.slide.on img,.slide:hover img{filter:none;opacity:1}
.car-bar{height:1px;background:var(--line);margin-top:26px;position:relative;overflow:hidden}
.car-bar i{position:absolute;inset:0 auto 0 0;width:20%;background:var(--accent);transition:transform .4s,width .4s}
@media (max-width:600px){.slide{height:min(115vw,480px);max-width:80vw}.car-btn{width:44px;height:44px}}

/* HORÁRIOS */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:50px 0 30px}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);padding:10px 20px;font-family:var(--head);letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;cursor:pointer;transition:.2s}
.tabs button.on,.tabs button:hover{border-color:var(--fg);color:var(--fg)}
.aula{display:grid;grid-template-columns:140px 1fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
.aula .h{font-family:var(--head);font-size:1.25rem;letter-spacing:.08em}
.aula .n{font-family:var(--head);text-transform:uppercase;letter-spacing:.15em}
.aula .p{color:var(--muted);font-size:.9rem}
.aula .t{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);padding:4px 10px;white-space:nowrap}

/* PLANOS */
.plano{border:1px solid var(--line);padding:44px 34px;display:flex;flex-direction:column;transition:.3s}
.plano:hover{border-color:#555}
.plano.dest{border-color:var(--accent);position:relative}
.plano .badge{position:absolute;top:0;left:24px;transform:translateY(-50%);background:var(--bg);padding:2px 10px;font-family:var(--head);color:var(--accent);letter-spacing:.3em;font-size:.72rem;text-transform:uppercase;margin:0}
.plano h3{font-size:1.3rem}
.plano .preco{font-family:var(--head);font-size:3rem;margin:18px 0 4px;letter-spacing:.02em}
.plano .preco small{font-size:1rem;color:var(--muted)}
.plano ul{list-style:none;margin:24px 0 34px;flex:1}
.plano li{padding:9px 0;border-bottom:1px solid var(--line);color:#bbb;font-size:.93rem}
.plano .btn{text-align:center}

/* CTA */
.cta{text-align:center;position:relative;overflow:hidden;padding:160px 0}
.cta .bg{position:absolute;inset:0;opacity:.35}
.cta .in{position:relative}
.cta h2{font-size:clamp(2.2rem,6vw,4.5rem)}
.cta .lead{margin:0 auto 44px}

/* CONTATO */
.info dt{font-family:var(--head);letter-spacing:.25em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin-top:26px}
.info dd{color:#ddd}
.info dd a:hover{color:var(--accent)}
.map{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;text-align:center;gap:22px;align-content:center;padding:24px 16px;background:linear-gradient(105deg,var(--g2),var(--g4) 35%,var(--g3) 55%,var(--g2) 80%,var(--g3));background-size:220% 100%;animation:metal 8s ease-in-out infinite alternate}
.map .route{display:grid;gap:16px;justify-items:center}
.map .how{color:#1b130d;font-family:var(--head);font-weight:500;font-size:clamp(1.3rem,2.6vw,1.8rem);letter-spacing:.3em;text-transform:uppercase}
.map .go{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.map .go a{background:#120d09;color:var(--g4);font-family:var(--head);letter-spacing:.2em;text-transform:uppercase;font-size:.72rem;padding:11px 18px;transition:.25s}
.map .go a:hover{background:#000;color:#fff}
.map .pin{width:30px;height:30px;border:2.5px solid #1b130d;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center}
.map .pin::after{content:"";width:8px;height:8px;border-radius:50%;background:#1b130d}
.map span{font-family:var(--head);letter-spacing:.25em;text-transform:uppercase;font-size:.8rem}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:60px 0 40px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.social{display:flex;gap:22px}
.social a{font-family:var(--head);letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:#bbb}
.social a:hover{color:var(--accent)}
footer small{color:#666;letter-spacing:.1em}

/* Itens em breve / desabilitados */
[hidden]{display:none!important}
.btn.off{opacity:.55;cursor:not-allowed;display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.btn.off small{font-size:.58rem;letter-spacing:.32em;opacity:.85}
.btn.solid.off:hover{background-position:0 0;color:#1b130d}
.btn.off:not(.solid):hover{background:none;color:var(--fg)}
.soon-txt{color:var(--muted);font-style:italic}
.aula-vazia{padding:34px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--head);letter-spacing:.25em;text-transform:uppercase;color:var(--accent);font-size:.9rem}
/* Planos em breve */
.soon{position:relative;margin-top:10px;padding:clamp(40px,7vw,80px) clamp(20px,6vw,80px);border:1px solid rgba(201,165,133,.35);text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(201,165,133,.12),transparent 60%)}
.soon::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--g3),var(--g4),var(--g3),transparent)}
.soon .mark{width:110px;aspect-ratio:930/317;margin:0 auto 28px;-webkit-mask:var(--m-roof) top/100% auto no-repeat;mask:var(--m-roof) top/100% auto no-repeat;background:linear-gradient(105deg,var(--g2),var(--g4) 40%,var(--g3) 60%,var(--g2));background-size:220% 100%;animation:metal 6s ease-in-out infinite alternate}
.soon h2{font-size:clamp(1.7rem,4.2vw,3rem);text-wrap:balance;max-width:820px;margin:0 auto 22px}
.soon .lead{margin:0 auto 34px}
/* Siglas */
.sig{background:none;border:0;padding:0;font:inherit;color:var(--g4);border-bottom:1px dotted var(--accent);cursor:pointer;line-height:inherit}
.sig:hover,.sig[aria-expanded=true]{color:var(--accent)}
.sig-pop{position:absolute;z-index:80;width:max-content;max-width:min(330px,calc(100vw - 32px));background:#15110e;border:1px solid var(--accent);padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.55);font-size:.9rem;line-height:1.5}
.sig-pop strong{display:block;font-family:var(--head);letter-spacing:.2em;color:var(--accent);font-weight:500;margin-bottom:4px}
.sig-pop span{display:block;color:var(--fg)}
.sig-pop a{display:inline-block;margin-top:10px;color:var(--g4);font-size:.8rem;letter-spacing:.08em;border-bottom:1px solid rgba(201,165,133,.5)}
.sig-pop a:hover{color:var(--accent)}
/* Boas-vindas */
.bv{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(5,5,5,.72);backdrop-filter:blur(4px);animation:lbIn .5s ease}
.bv-box{position:relative;width:min(520px,100%);background:#0f0d0b;border:1px solid rgba(201,165,133,.45);padding:clamp(30px,6vw,48px) clamp(22px,5vw,44px) clamp(26px,5vw,38px);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.bv-box::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--g3),var(--g4),var(--g3),transparent)}
.bv-box .mark{width:96px;aspect-ratio:930/317;margin:0 auto 18px;-webkit-mask:var(--m-roof) top/100% auto no-repeat;mask:var(--m-roof) top/100% auto no-repeat;background:linear-gradient(105deg,var(--g2),var(--g4) 40%,var(--g3) 60%,var(--g2));background-size:220% 100%;animation:metal 6s ease-in-out infinite alternate}
.bv-box .kicker{margin-bottom:10px}
.bv-box h2{font-size:clamp(1.5rem,4vw,2.1rem);margin-bottom:18px}
.bv-box p.t{color:var(--muted);font-size:.98rem}
.bv-box p.t+p.t{margin-top:10px}
.bv-box .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.bv-box .acts .btn{padding:14px 26px;font-size:.78rem}
.bv-x{position:absolute;top:10px;right:10px;width:40px;height:40px;background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer}
.bv-x:hover{color:var(--fg)}
.wa.ig.solo{right:calc(20px + env(safe-area-inset-right,0px))}

/* WhatsApp flutuante */
.wa{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.3s}
.wa:hover{transform:scale(1.08)}
.wa svg{width:30px;height:30px;fill:#fff}
.wa.ig{right:calc(90px + env(safe-area-inset-right,0px));background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.wa.ig svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2}
.wa.ig svg .dot{fill:#fff;stroke:none}

/* Animação ao rolar: o conteúdo fica sempre visível; só desliza de leve */
.rv.go{animation:up .9s ease both}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.crest *,.crest .layer::before,.hero .in > p,.hero .ctas,.logo *{animation:none!important}.crest .flare{display:none}.rv.go{animation:none}html{scroll-behavior:auto}.scroll{animation:none}}

/* MOBILE */
@media (max-width:900px){
  section{padding:80px 0}

// Carrossel da Galeria de Competição: a foto do centro fica em destaque
(() => {
  const track = document.getElementById("track");
  if (!track) return;
  const slides = [...track.children], prev = document.getElementById("carPrev"), next = document.getElementById("carNext");
  const bar = document.getElementById("carBar"), now = document.getElementById("carNow");
  const last = slides.length - 1;
  // Se a última foto for estreita demais, a penúltima não teria espaço para ficar no centro.
  // Nesse caso abrimos um respiro à direita para que ela centralize (e a última também).
  const fit = () => {
    const cw = track.clientWidth, gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    const pen = slides[last - 1], lst = slides[last];
    const falta = pen ? (cw - pen.offsetWidth) / 2 - gap - lst.offsetWidth : 0;
    if (falta > 0) {
      track.style.paddingRight = Math.ceil((cw - lst.offsetWidth) / 2) + "px";
      lst.style.scrollSnapAlign = "center"; lst.style.transformOrigin = "center";
    } else {
      track.style.paddingRight = ""; lst.style.scrollSnapAlign = ""; lst.style.transformOrigin = "";
    }
  };
  fit();
  const target = i => {
    const sl = slides[i], base = sl.offsetLeft - track.offsetLeft;
    if (i === 0) return 0;
    if (i === last) return track.scrollWidth - track.clientWidth;
    return base - (track.clientWidth - sl.offsetWidth) / 2;
  };
  const current = () => {
    const max = track.scrollWidth - track.clientWidth, x = track.scrollLeft;
    if (x <= 4) return 0;
    if (x >= max - 4) return last;
    const mid = x + track.clientWidth / 2;
    let best = 0, bd = Infinity;
    slides.forEach((sl, i) => { const c = sl.offsetLeft - track.offsetLeft + sl.offsetWidth / 2, d = Math.abs(c - mid); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  let active = -1;
  const update = () => {
    const i = current(), max = track.scrollWidth - track.clientWidth;
    if (i !== active) { active = i; slides.forEach((sl, k) => sl.classList.toggle("on", k === i)); }
    now.textContent = String(i + 1).padStart(2, "0");
    prev.disabled = i === 0; next.disabled = i === last;
    const vis = Math.min(1, track.clientWidth / track.scrollWidth);
    bar.style.width = (vis * 100) + "%";
    bar.style.transform = `translateX(${max > 0 ? (track.scrollLeft / max) * ((1 - vis) / vis) * 100 : 0}%)`;
  };
  const go = d => { const i = Math.max(0, Math.min(last, current() + d)); track.scrollTo({ left: target(i), behavior: "smooth" }); };
  prev.onclick = () => go(-1); next.onclick = () => go(1);
  slides.forEach((sl, i) => sl.addEventListener("click", () => { if (!moved) track.scrollTo({ left: target(i), behavior: "smooth" }); }));
  track.addEventListener("keydown", e => { if (e.key === "ArrowRight") { e.preventDefault(); go(1); } if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } });
  track.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
  addEventListener("resize", () => { fit(); update(); });
  slides.forEach(sl => { const im = sl.querySelector("img"); if (im && !im.complete) im.addEventListener("load", () => { fit(); update(); }, { once: true }); });
  // arrastar com o mouse no computador
  let down = false, sx = 0, sl0 = 0, moved = false;
  track.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = true; moved = false; sx = e.clientX; sl0 = track.scrollLeft; track.style.scrollSnapType = "none"; track.style.scrollBehavior = "auto"; });
  addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 4) moved = true; track.scrollLeft = sl0 - dx; });
  addEventListener("pointerup", () => { if (!down) return; down = false; track.style.scrollBehavior = ""; track.style.scrollSnapType = ""; if (moved) go(0); setTimeout(() => moved = false, 0); });
  track.addEventListener("dragstart", e => e.preventDefault());
  update();
})();

    const d = (C.siglas || {})[btn.dataset.sig]; if (!d) return;

    pop.hidden = false;

    pop.style.left = (left + scrollX) + "px"; pop.style.top = (r.bottom + scrollY + 10) + "px";
  };
  document.addEventListener("click", e => {
    const b = e.target.closest(".sig");
    if (b) { e.preventDefault(); open(b); return; }
    if (!pop.contains(e.target)) close();

})();

(() => {

      </div>

  const back = document.activeElement;
  const close = () => {

      const f = [...box.querySelectorAll("button, a[href]")], first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  const show = () => {
    document.body.appendChild(box);
    box.querySelector("#bvOk").focus();
    box.addEventListener("click", e => { if (e.target === box || e.target.closest(".bv-x") || e.target.id === "bvOk") close(); });
    addEventListener("keydown", onKey);

// ===== Luz do sol sobre a logo + poeira dourada =====
(() => {
  const crest = document.getElementById("crest"), hero = document.getElementById("topo");
  if (!crest) return;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = performance.now();
  let px = null, py = null, lastMove = -1e9, lx = 50, ly = -20, visible = true;
  hero.addEventListener("pointermove", e => {
    const r = crest.getBoundingClientRect();
    px = (e.clientX - r.left) / r.width * 100; py = (e.clientY - r.top) / r.height * 100; lastMove = performance.now();
  });
  new IntersectionObserver(([e]) => visible = e.isIntersecting).observe(hero);

  // poeira dourada flutuando na luz
  const cv = document.getElementById("dust"), ctx = cv.getContext("2d");
  let W, H, dpr, motes = [];
  const size = () => {
    dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    motes = Array.from({ length: Math.round(Math.min(90, W / 14)) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3,
      vx: (Math.random() - .5) * .12, vy: -(Math.random() * .25 + .05), ph: Math.random() * 6.28, sp: Math.random() * .02 + .005 }));
  };
  size(); addEventListener("resize", size);

  const frame = now => {
    requestAnimationFrame(frame);
    if (!visible) return;
    // sem mouse: o "sol" faz um arco lento sobre o telhado; com mouse/dedo, segue o ponteiro
    const idle = now - lastMove > 2500 || px === null;
    const a = ((now - t0) / 9000) % 1;
    const tx = idle ? -15 + a * 130 : px, ty = idle ? 55 - Math.sin(a * Math.PI) * 75 : py;
    lx += (tx - lx) * .06; ly += (ty - ly) * .06;
    crest.style.setProperty("--lx", lx.toFixed(2) + "%"); crest.style.setProperty("--ly", ly.toFixed(2) + "%");

    ctx.clearRect(0, 0, W, H);
    const r = crest.getBoundingClientRect(), hr = hero.getBoundingClientRect();
    const sx = r.left - hr.left + r.width / 2, sy = r.top - hr.top + r.height * .014;
    for (const m of motes) {
      m.x += m.vx; m.y += m.vy; m.ph += m.sp;
      if (m.y < -5) { m.y = H + 5; m.x = Math.random() * W; }
      if (m.x < -5) m.x = W + 5; if (m.x > W + 5) m.x = -5;
      const d = Math.hypot(m.x - sx, m.y - sy), near = Math.max(0, 1 - d / (Math.max(W, H) * .55));
      const al = (.15 + .85 * near) * (.45 + .55 * Math.sin(m.ph));
      if (al <= 0) continue;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * (1 + near), 0, 6.283);
      ctx.fillStyle = `rgba(240,214,182,${al.toFixed(3)})`; ctx.fill();
    }
  };
  if (!calm) requestAnimationFrame(frame);
})();

// Animação de entrada
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("go"); io.unobserve(e.target); } }), { threshold: .12 });
